license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
LDLib2-based window manager for Minecraft.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="[26.1.2.39,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[15.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "handy.mixins.json"